<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Beatly Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0A0A0C;
    }
    #wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0A0A0C;
    }
    /* 9:16 vertical crop: 100vh height, 177.78vh width for 16:9 widescreen video */
    #player {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 177.78vh;
      height: 100vh;
      min-width: 100vw;
      transform: translate(-50%, -50%);
      border: none;
      pointer-events: none;
      background: #0A0A0C;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <iframe
      id="player"
      src=""
      allow="autoplay; encrypted-media; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin"
      playsinline
    ></iframe>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var videoId = params.get('v');
    var start = params.get('t') || 0;
    var iframe = document.getElementById('player');

    if (videoId) {
      var embedUrl = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(videoId) +
        '?autoplay=1&mute=0&controls=0&loop=1&playlist=' + encodeURIComponent(videoId) +
        '&playsinline=1&rel=0&fs=0&iv_load_policy=3&disablekb=1&enablejsapi=1' +
        (start > 0 ? '&start=' + start : '');
      iframe.src = embedUrl;
    }

    window.addEventListener('message', function(e) {
      if (!iframe || !iframe.contentWindow) return;
      var msg = e.data;
      if (typeof msg === 'string') {
        try { msg = JSON.parse(msg); } catch(err) {}
      }
      if (msg === 'pause' || (msg && msg.action === 'pause')) {
        iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
      } else if (msg === 'play' || (msg && msg.action === 'play')) {
        iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
      }
    });
  </script>
</body>
</html>
