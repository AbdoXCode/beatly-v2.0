<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Beatly Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0A0A0C;
    }
    #wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0A0A0C;
    }
    /* 9:16 vertical crop: 100vh height, 177.78vh width for 16:9 widescreen video */
    #yt-player, iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 177.78vh;
      height: 100vh;
      min-width: 100vw;
      transform: translate(-50%, -50%);
      border: none;
      pointer-events: none;
      background: #0A0A0C;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center;
      background: #0A0A0C;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="yt-player"></div>
  </div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var params = new URLSearchParams(window.location.search);
    var videoId = params.get('v') || 'hX9S94XsySk';
    var directSrc = params.get('src');
    var start = parseFloat(params.get('t')) || 0;
    var duration = parseFloat(params.get('d')) || 30;
    var isMuted = params.get('mute') === '1' ? 1 : 0;
    var showControls = params.get('controls') === '1' ? 1 : 0;
    var wrapper = document.getElementById('wrapper');
    var ytPlayerDiv = document.getElementById('yt-player');
    var player = null;
    var loopTimer = null;
    var video = null;

    if (directSrc) {
      if (ytPlayerDiv) ytPlayerDiv.style.display = 'none';
      video = document.createElement('video');
      video.src = directSrc;
      video.autoplay = true;
      video.loop = true;
      video.muted = isMuted === 1;
      video.playsInline = true;
      video.setAttribute('webkit-playsinline', 'true');
      video.setAttribute('playsinline', 'true');
      if (start > 0) video.currentTime = start;
      wrapper.appendChild(video);
      video.play().catch(function() {});
    } else {
      function startLoopChecker() {
        if (loopTimer) clearInterval(loopTimer);
        if (duration > 0 && start > 0) {
          loopTimer = setInterval(function() {
            if (player && typeof player.getCurrentTime === 'function') {
              var cur = player.getCurrentTime();
              if (cur >= start + duration || cur < start - 2) {
                player.seekTo(start, true);
              }
            }
          }, 500);
        }
      }

      function initYouTube() {
        if (player) return;
        if (window.YT && window.YT.Player) {
          player = new YT.Player('yt-player', {
            videoId: videoId,
            playerVars: {
              autoplay: 1,
              mute: isMuted,
              controls: showControls,
              playsinline: 1,
              rel: 0,
              fs: 0,
              iv_load_policy: 3,
              disablekb: 1,
              start: Math.floor(start),
              origin: window.location.origin
            },
            events: {
              onReady: function(e) {
                if (start > 0) {
                  e.target.seekTo(start, true);
                }
                e.target.playVideo();
                startLoopChecker();
              },
              onStateChange: function(e) {
                if (e.data === YT.PlayerState.ENDED) {
                  if (start > 0) {
                    e.target.seekTo(start, true);
                  } else {
                    e.target.seekTo(0, true);
                  }
                  e.target.playVideo();
                }
              }
            }
          });
        } else {
          var iframe = document.createElement('iframe');
          iframe.id = 'yt-player-iframe';
          iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
          iframe.referrerPolicy = 'strict-origin-when-cross-origin';
          iframe.setAttribute('playsinline', '1');
          var embedUrl = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(videoId) +
            '?autoplay=1&mute=' + isMuted + '&controls=' + showControls +
            '&playsinline=1&rel=0&fs=0&iv_load_policy=3&disablekb=1&enablejsapi=1' +
            (start > 0 ? '&start=' + Math.floor(start) : '');
          iframe.src = embedUrl;
          wrapper.appendChild(iframe);
          if (ytPlayerDiv) ytPlayerDiv.style.display = 'none';
        }
      }

      if (window.YT && window.YT.Player) {
        initYouTube();
      } else {
        window.onYouTubeIframeAPIReady = initYouTube;
        setTimeout(function() {
          if (!player) initYouTube();
        }, 1200);
      }
    }

    window.addEventListener('message', function(e) {
      var msg = e.data;
      if (typeof msg === 'string') {
        try { msg = JSON.parse(msg); } catch(err) {}
      }
      var isPause = msg === 'pause' || (msg && msg.action === 'pause');
      var isPlay = msg === 'play' || (msg && msg.action === 'play');

      if (video) {
        if (isPause && !video.paused) video.pause();
        if (isPlay && video.paused) video.play().catch(function() {});
      }
      if (player && typeof player.pauseVideo === 'function') {
        if (isPause) {
          player.pauseVideo();
        } else if (isPlay) {
          player.playVideo();
        }
      } else {
        var fallbackIframe = document.getElementById('yt-player-iframe') || document.querySelector('iframe');
        if (fallbackIframe && fallbackIframe.contentWindow) {
          if (isPause) {
            fallbackIframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
          } else if (isPlay) {
            fallbackIframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
          }
        }
      }
    });
  </script>
</body>
</html>
